<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SSB64 Web match</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; }
  /* N64 picture: 4:3, as large as fits. */
  canvas { width: min(100vw, calc(100vh * 4 / 3)); height: min(100vh, calc(100vw * 3 / 4)); display: block; outline: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<script src="play.js"></script>
</body>
</html>
